<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">
    <f:be.pageRenderer includeCssFiles="{0: 'EXT:maidem_stacktree/Resources/Public/Css/stacktree.css'}" />
    <f:if condition="{pid} == 0">
        <f:then>
            <f:be.infobox state="-1"><f:translate key="LLL:EXT:maidem_stacktree/Resources/Private/Language/locallang_mod.xlf:select_folder" /></f:be.infobox>
        </f:then>
        <f:else>
            <f:if condition="{layout.h}">
                <f:then>
                    <p class="text-body-secondary"><f:translate key="LLL:EXT:maidem_stacktree/Resources/Private/Language/locallang_mod.xlf:hint" /></p>
                    <div class="cb-stacktree is-visible">
                        <f:render partial="Tree" arguments="{diagram: layout.h, variant: 'h', label: 'Stack'}" />
                        <f:render partial="Tree" arguments="{diagram: layout.v, variant: 'v', label: 'Stack'}" />
                    </div>
                </f:then>
                <f:else>
                    <f:be.infobox state="-1"><f:translate key="LLL:EXT:maidem_stacktree/Resources/Private/Language/locallang_mod.xlf:empty" /></f:be.infobox>
                </f:else>
            </f:if>
        </f:else>
    </f:if>
</f:section>
</html>
