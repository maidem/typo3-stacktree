<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{layout.h}">
    <f:variable name="label" value="{f:if(condition: header, then: header, else: 'Stack')}" />
    <section class="cb-stacktree">
        <f:if condition="{header}"><h2 class="cb-stacktree__heading">{header}</h2></f:if>
        <f:render partial="Tree" arguments="{diagram: layout.h, variant: 'h', label: label}" />
        <f:render partial="Tree" arguments="{diagram: layout.v, variant: 'v', label: label}" />
    </section>
</f:if>
</html>
